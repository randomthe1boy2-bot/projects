<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Hub</title>
  <style>
    :root {
      --bg: #0d0d0d;
      --card-bg: #141414;
      --border: #2a2a2a;
      --text: #e0e0e0;
      --text-muted: #888888;
      --white: #ffffff;
      --black: #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      overflow-x: hidden;
    }

    /* Subtle background grid */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: 
        radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 24px 24px;
      z-index: -1;
      pointer-events: none;
    }

    header {
      text-align: center;
      margin-bottom: 3.5rem;
      animation: fadeInDown 0.8s ease-out forwards;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--white);
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      letter-spacing: 0.02em;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      width: 100%;
      max-width: 800px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), 
                  border-color 0.3s ease, 
                  box-shadow 0.3s ease;
      opacity: 0;
      animation: fadeInUp 0.8s ease-out forwards;
    }

    .card:nth-child(1) {
      animation-delay: 0.15s;
    }

    .card:nth-child(2) {
      animation-delay: 0.3s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #555555;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .card-title {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--white);
      margin-bottom: 0.75rem;
      letter-spacing: -0.01em;
    }

    .card-description {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.25rem;
      background-color: var(--white);
      color: var(--black);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 6px;
      transition: background-color 0.2s ease, transform 0.2s ease;
      text-align: center;
    }

    .btn:hover {
      background-color: #cccccc;
      transform: scale(1.01);
    }

    .btn:active {
      transform: scale(0.98);
    }

    footer {
      margin-top: 4rem;
      color: var(--text-muted);
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      animation: fadeIn 1s ease-out 0.5s forwards;
      opacity: 0;
    }

    /* Keyframe Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Project Hub</h1>
    <p>Select a destination to continue</p>
  </header>

  <main class="container">
    <!-- TurboV Launcher -->
    <article class="card">
      <div>
        <h2 class="card-title">TurboV Launcher</h2>
        <p class="card-description">Access the core interface and dashboard tools.</p>
      </div>
      <a href="https://launcher.turbov.dev" class="btn" target="_blank" rel="noopener noreferrer">
        Visit website
      </a>
    </article>

    <!-- The Uncensored -->
    <article class="card">
      <div>
        <h2 class="card-title">The Uncensored</h2>
        <p class="card-description">Explore the unrestricted content hub.</p>
      </div>
      <a href="https://theuncensored.turbov.dev" class="btn" target="_blank" rel="noopener noreferrer">
        Visit website
      </a>
    </article>
  </main>

  <footer>
    &copy; TurboV. All rights reserved.
  </footer>

</body>
</html>
